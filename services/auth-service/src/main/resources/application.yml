server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── RABBITMQ — CloudAMQP ─────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    ssl:
      enabled: true               # CloudAMQP requiere SSL
    listener:
      simple:
        acknowledge-mode: manual  # ACK manual = más control sobre errores
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          multiplier: 2.0

# ── JWT ──────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}           # misma clave que auth-service
  expiration: 86400000
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}